services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trygiraffes
      POSTGRES_PASSWORD: trygiraffes
      POSTGRES_DB: trygiraffes
    ports:
      - "5433:5432"
    volumes:
      - trygiraffes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trygiraffes -d trygiraffes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      LOG_FORMAT: text
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://trygiraffes:trygiraffes@db:5432/trygiraffes?sslmode=disable
      SESSION_COOKIE_NAME: tg_session
      SESSION_TTL_HOURS: "24"
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trygiraffes_pgdata:
